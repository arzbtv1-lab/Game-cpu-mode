          mkdir -p app/src/main/java/com/gamecpu/mode
          cat > app/src/main/java/com/gamecpu/mode/CpuController.kt <<'__END__'
          package com.gamecpu.mode

          import java.io.File

          /** อ่านและตั้งค่าความเร็ว CPU ผ่าน cpufreq ของเคอร์เนล (การตั้งค่าต้องใช้ root หรือ Shizuku ที่ได้รับอนุญาตเขียน) */
          object CpuController {

              data class Cluster(
                  val path: String,
                  val cpus: String,
                  val minKhz: Long,
                  val maxKhz: Long,
                  val curKhz: Long,
                  val steps: List<Long>
              )

              private const val BASE = "/sys/devices/system/cpu/cpufreq"

              private fun File.readLong(): Long? = try { readText().trim().toLong() } catch (e: Exception) { null }

              fun readClusters(): List<Cluster> {
                  val policies = File(BASE).listFiles { f -> f.name.startsWith("policy") }
                      ?.sortedBy { it.name } ?: return emptyList()
                  return policies.mapNotNull { p ->
                      val hwMin = File(p, "cpuinfo_min_freq").readLong() ?: return@mapNotNull null
                      val hwMax = File(p, "cpuinfo_max_freq").readLong() ?: return@mapNotNull null
                      val cur = File(p, "scaling_cur_freq").readLong() ?: File(p, "cpuinfo_cur_freq").readLong() ?: 0L
                      val steps = try {
                          File(p, "scaling_available_frequencies").readText().trim()
                              .split(Regex("\\s+")).mapNotNull { it.toLongOrNull() }.sorted()
                      } catch (e: Exception) { emptyList() }
                      val cpus = try { File(p, "related_cpus").readText().trim() } catch (e: Exception) { p.name }
                      Cluster(p.absolutePath, cpus, hwMin, hwMax, cur, if (steps.isEmpty()) listOf(hwMin, hwMax) else steps)
                  }
              }

              private fun su(cmd: String): Boolean = try {
                  val proc = Runtime.getRuntime().exec(arrayOf("su", "-c", cmd))
                  proc.waitFor() == 0
              } catch (e: Exception) { false }

              fun hasRoot(): Boolean = su("id")

              /** ลอง root ก่อน ถ้าไม่ได้ลองผ่าน Shizuku */
              private fun run(cmd: String): Boolean {
                  if (su(cmd)) return true
                  if (!Shell.available()) return false
                  val out = Shell.run("$cmd 2>&1; echo EXIT=\$?") ?: return false
                  return out.contains("EXIT=0")
              }

              /**
               * ทดสอบว่า Shizuku เขียนไฟล์ควบคุมความเร็ว CPU ได้ไหม โดยเขียนค่าเดิมกลับเข้าไป (ไม่เปลี่ยนความเร็วจริง)
               * คืนค่า (ผ่านไหม, ข้อความผล)
               */
              fun testWriteViaShizuku(): Pair<Boolean, String> {
                  if (!Shell.available()) return false to "Shizuku ไม่ทำงาน หรือยังไม่ได้อนุญาตแอปนี้"
                  val c = readClusters().firstOrNull() ?: return false to "อ่านค่า CPU ไม่ได้"
                  val p = c.path
                  val out = Shell.run("v=\$(cat $p/scaling_max_freq); echo \"\$v\" > $p/scaling_max_freq 2>&1; echo EXIT=\$?")
                      ?: return false to "สั่งคำสั่งผ่าน Shizuku ไม่ได้"
                  return if (out.contains("EXIT=0")) {
                      true to "เขียนค่าได้"
                  } else {
                      false to (out.lines().firstOrNull { it.isNotBlank() && !it.startsWith("EXIT") } ?: "ถูกปฏิเสธ")
                  }
              }

              fun canAdjust(): Boolean = hasRoot() || testWriteViaShizuku().first

              /** ตั้งเพดานความเร็ว (kHz) ได้เฉพาะค่าที่อยู่ในรายการความเร็วของ cluster นั้น */
              fun setMaxFreq(cluster: Cluster, khz: Long): Boolean {
                  if (khz !in cluster.steps) return false
                  return run("echo $khz > ${cluster.path}/scaling_max_freq")
              }

              fun reset(cluster: Cluster): Boolean =
                  run("echo ${cluster.maxKhz} > ${cluster.path}/scaling_max_freq")

              fun resetAll() = readClusters().forEach { reset(it) }
          }
          __END__
          mkdir -p app/src/main/java/com/gamecpu/mode
          cat > app/src/main/java/com/gamecpu/mode/GameMode.kt <<'__END__'
          package com.gamecpu.mode

          import android.app.ActivityManager
          import android.app.NotificationManager
          import android.content.Context
          import android.content.pm.ApplicationInfo

          /** Game Mode: เปิดห้ามรบกวน + ล้างแอปพื้นหลัง (ทำได้จริงโดยไม่ต้อง root) */
          object GameMode {
              private const val PREFS = "game_mode"
              private val keep = setOf("moe.shizuku.privileged.api")

              private fun nm(ctx: Context) = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

              fun isOn(ctx: Context): Boolean =
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getBoolean("on", false)

              fun hasPolicyAccess(ctx: Context): Boolean = nm(ctx).isNotificationPolicyAccessGranted

              fun freeRamMb(ctx: Context): Long {
                  val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val info = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(info)
                  return info.availMem / (1024 * 1024)
              }

              /** ขอให้ระบบปิดโปรเซสพื้นหลังของแอปที่ผู้ใช้ติดตั้ง (ระบบอาจเปิดบางตัวกลับมาเอง) */
              fun clearBackground(ctx: Context): Int {
                  val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  var n = 0
                  for (app in ctx.packageManager.getInstalledApplications(0)) {
                      if ((app.flags and ApplicationInfo.FLAG_SYSTEM) != 0) continue
                      if (app.packageName == ctx.packageName || app.packageName in keep) continue
                      am.killBackgroundProcesses(app.packageName)
                      n++
                  }
                  return n
              }

              /** คืนจำนวนแอปที่สั่งปิดพื้นหลัง */
              fun enable(ctx: Context): Int {
                  val n = nm(ctx)
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      .putInt("prev_filter", n.currentInterruptionFilter)
                      .putBoolean("on", true).apply()
                  n.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_PRIORITY)
                  return clearBackground(ctx)
              }

              fun disable(ctx: Context) {
                  val p = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  if (hasPolicyAccess(ctx)) {
                      val prev = p.getInt("prev_filter", NotificationManager.INTERRUPTION_FILTER_ALL)
                      nm(ctx).setInterruptionFilter(
                          if (prev == NotificationManager.INTERRUPTION_FILTER_UNKNOWN) NotificationManager.INTERRUPTION_FILTER_ALL else prev
                      )
                  }
                  p.edit().putBoolean("on", false).apply()
              }
          }
          __END__
          mkdir -p app/src/main/java/com/gamecpu/mode
          cat > app/src/main/java/com/gamecpu/mode/PerformanceActivity.kt <<'__END__'
          package com.gamecpu.mode

          import android.app.Activity
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.*
          import rikka.shizuku.Shizuku

          /** หน้าหลัก Game CPU mode: เปิดเกม + Game Mode, ปรับ CPU (ถ้าได้สิทธิ์), เชื่อม Shizuku */
          class PerformanceActivity : Activity() {

              private var canAdjust = false
              private var gameSwitch: Switch? = null
              private var gameListener: CompoundButton.OnCheckedChangeListener? = null

              override fun onResume() {
                  super.onResume()
                  gameSwitch?.let { s ->
                      s.setOnCheckedChangeListener(null)
                      s.isChecked = GameMode.isOn(this)
                      s.setOnCheckedChangeListener(gameListener)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val dp = resources.displayMetrics.density
                  val pad = (16 * dp).toInt()
                  val prefs = getSharedPreferences("ui", MODE_PRIVATE)
                  val green = Color.parseColor("#4CD964")
                  val grey = Color.parseColor("#AAAAAA")

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                      setBackgroundColor(Color.parseColor("#1C1C1E"))
                  }
                  fun label(text: String, size: Float = 14f, color: Int = Color.WHITE) =
                      TextView(this).apply { this.text = text; textSize = size; setTextColor(color) }
                  fun section(text: String) =
                      label(text, 16f).apply { setPadding(0, (20 * dp).toInt(), 0, 0) }

                  col.addView(label("Game CPU mode", 20f))
                  val status = label("กำลังตรวจสอบสิทธิ์...", 13f, grey)
                  col.addView(status)

                  // ---------- เปิดเกม ----------
                  col.addView(section("เปิดเกม"))
                  val pm = packageManager
                  val games = pm.getInstalledApplications(0)
                      .filter {
                          (it.flags and ApplicationInfo.FLAG_SYSTEM) == 0 &&
                              it.packageName != packageName &&
                              pm.getLaunchIntentForPackage(it.packageName) != null
                      }
                      .sortedBy { pm.getApplicationLabel(it).toString().lowercase() }
                  val spinner = Spinner(this)
                  spinner.adapter = ArrayAdapter(
                      this, android.R.layout.simple_spinner_dropdown_item,
                      games.map { pm.getApplicationLabel(it).toString() }
                  )
                  val saved = prefs.getString("game_pkg", "com.roblox.client")
                  val idx = games.indexOfFirst { it.packageName == saved }
                  if (idx >= 0) spinner.setSelection(idx)
                  col.addView(spinner)

                  val launchBtn = Button(this).apply { text = "เปิดเกม + Game Mode" }
                  launchBtn.setOnClickListener {
                      if (games.isEmpty()) return@setOnClickListener
                      val app = games[spinner.selectedItemPosition]
                      prefs.edit().putString("game_pkg", app.packageName).apply()
                      if (GameMode.hasPolicyAccess(this)) {
                          if (!GameMode.isOn(this)) GameMode.enable(this) else GameMode.clearBackground(this)
                      } else {
                          GameMode.clearBackground(this)
                          Toast.makeText(this, "ยังไม่ได้ให้สิทธิ์ห้ามรบกวน จึงล้างแรมอย่างเดียว", Toast.LENGTH_LONG).show()
                      }
                      pm.getLaunchIntentForPackage(app.packageName)?.let { startActivity(it) }
                  }
                  col.addView(launchBtn)

                  // ---------- Game Mode ----------
                  col.addView(section("Game Mode"))
                  val gs = Switch(this).apply {
                      text = "ห้ามรบกวน + ล้างแอปพื้นหลัง"; setTextColor(Color.WHITE)
                      isChecked = GameMode.isOn(this@PerformanceActivity)
                  }
                  val ramText = label("แรมว่างตอนนี้ ${GameMode.freeRamMb(this)} MB", 12f, green)
                  gameListener = CompoundButton.OnCheckedChangeListener { btn, on ->
                      if (on) {
                          if (!GameMode.hasPolicyAccess(this)) {
                              btn.isChecked = false
                              Toast.makeText(this, "เปิดสิทธิ์ \"ห้ามรบกวน\" ให้ Game CPU mode แล้วกลับมาเปิดสวิตช์อีกครั้ง", Toast.LENGTH_LONG).show()
                              startActivity(Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS))
                          } else if (!GameMode.isOn(this)) {
                              val before = GameMode.freeRamMb(this)
                              val n = GameMode.enable(this)
                              Handler(Looper.getMainLooper()).postDelayed({
                                  ramText.text = "สั่งปิดพื้นหลัง $n แอป | แรมว่าง $before → ${GameMode.freeRamMb(this)} MB"
                              }, 1500)
                          }
                      } else if (GameMode.isOn(this)) {
                          GameMode.disable(this)
                      }
                  }
                  gs.setOnCheckedChangeListener(gameListener)
                  gameSwitch = gs
                  col.addView(gs)
                  col.addView(ramText)

                  // ---------- ปรับความเร็ว CPU ----------
                  col.addView(section("ความเร็ว CPU"))
                  val master = Switch(this).apply {
                      text = "Clock speed customization"; setTextColor(Color.WHITE); isEnabled = false
                  }
                  col.addView(master)
                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(list)
                  val reset = Button(this).apply { text = "คืนค่าเริ่มต้น"; isEnabled = false }
                  col.addView(reset)

                  // ---------- Shizuku ----------
                  col.addView(section("Shizuku"))
                  val shizukuText = label("", 12f, grey)
                  val shizukuBtn = Button(this).apply { text = "เชื่อม Shizuku" }
                  val testBtn = Button(this).apply { text = "ทดสอบสั่งปรับ CPU ผ่าน Shizuku" }
                  fun refreshShizuku() {
                      shizukuText.text = try {
                          when {
                              !Shizuku.pingBinder() -> "Shizuku: ไม่ทำงาน (เปิดแอป Shizuku แล้วกดเริ่มก่อน)"
                              Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED -> "Shizuku: เชื่อมแล้ว"
                              else -> "Shizuku: ทำงานอยู่ แต่ยังไม่ได้อนุญาตแอปนี้ กดปุ่มเชื่อม"
                          }
                      } catch (e: Throwable) { "Shizuku: ตรวจสอบไม่ได้" }
                  }
                  shizukuBtn.setOnClickListener {
                      try {
                          if (!Shizuku.pingBinder()) {
                              Toast.makeText(this, "เปิดแอป Shizuku แล้วกดเริ่มก่อน", Toast.LENGTH_LONG).show()
                          } else if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                              Shizuku.requestPermission(1001)
                          }
                      } catch (e: Throwable) {
                          Toast.makeText(this, "เชื่อม Shizuku ไม่ได้", Toast.LENGTH_LONG).show()
                      }
                      refreshShizuku()
                  }
                  testBtn.setOnClickListener {
                      Thread {
                          val (ok, msg) = CpuController.testWriteViaShizuku()
                          runOnUiThread {
                              Toast.makeText(
                                  this,
                                  (if (ok) "ทดสอบผ่าน: " else "ทดสอบไม่ผ่าน: ") + msg,
                                  Toast.LENGTH_LONG
                              ).show()
                              shizukuText.text = (if (ok) "ผลทดสอบ: ผ่าน (" else "ผลทดสอบ: ไม่ผ่าน (") + msg + ")"
                              if (ok) recreate()
                          }
                      }.start()
                  }
                  try {
                      Shizuku.addRequestPermissionResultListener { _, _ -> runOnUiThread { refreshShizuku() } }
                  } catch (e: Throwable) { }
                  refreshShizuku()
                  col.addV
